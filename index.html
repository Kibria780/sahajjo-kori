<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>সাহায্য করি — সবার জন্য উন্মুক্ত AI মেন্টর</title>
<meta name="description" content="সাহায্য করি — যেকোনো নৈতিক প্রশ্নের উত্তর দেবে AI মেন্টর, Hasan-এর পক্ষ থেকে। সম্পূর্ণ ফ্রি, সবার জন্য উন্মুক্ত।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7f4; --card:#ffffff; --ink:#1d2b22; --muted:#64766a;
    --green:#0d7a4f; --green-d:#0a5c3e; --green-dd:#083d2b;
    --amber:#f5a623; --line:#e2ebe4; --soft:#edf5ee;
    --user-b:#0d7a4f; --shadow:0 2px 12px rgba(15,45,28,.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; font-family:'Hind Siliguri',sans-serif; background:var(--bg); color:var(--ink); line-height:1.65;}
  .app{display:flex; height:100dvh; overflow:hidden;}

  /* ---------- Sidebar ---------- */
  .sidebar{width:290px; flex:none; background:linear-gradient(180deg,var(--green-d),var(--green-dd)); color:#fff;
    display:flex; flex-direction:column; z-index:40;}
  .brand{padding:18px 16px 12px; border-bottom:1px solid rgba(255,255,255,.12);}
  .brand h1{margin:0; font-size:1.35rem; display:flex; align-items:center; gap:8px;}
  .brand p{margin:4px 0 0; font-size:.8rem; opacity:.75;}
  .newchat{margin:14px 16px 6px; background:var(--amber); color:#3a2a00; border:none; border-radius:12px;
    padding:11px; font-family:inherit; font-weight:700; font-size:.95rem; cursor:pointer;}
  .newchat:hover{filter:brightness(1.05);}
  .side-sec{padding:8px 16px 4px; font-size:.75rem; letter-spacing:.06em; opacity:.6; text-transform:uppercase;}
  .convs{flex:1; overflow-y:auto; padding:0 10px 10px;}
  .conv{display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; cursor:pointer;
    font-size:.9rem; margin-bottom:4px; border:1px solid transparent;}
  .conv:hover{background:rgba(255,255,255,.08);}
  .conv.active{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.2);}
  .conv .t{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .conv .x{background:none; border:none; color:rgba(255,255,255,.55); cursor:pointer; font-size:1rem; padding:0 2px;}
  .conv .x:hover{color:#ffb3a7;}
  .empty-hist{padding:10px 16px; font-size:.85rem; opacity:.6;}
  .side-foot{border-top:1px solid rgba(255,255,255,.12); padding:10px 12px; display:flex; flex-direction:column; gap:6px;}
  .side-btn{background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.14); border-radius:10px;
    padding:9px 12px; font-family:inherit; font-size:.88rem; cursor:pointer; text-align:left;}
  .side-btn:hover{background:rgba(255,255,255,.14);}
  details.keyset{font-size:.82rem; opacity:.95;}
  details.keyset summary{cursor:pointer; padding:9px 12px; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14); border-radius:10px; font-size:.88rem;}
  details.keyset .kin{padding:10px 4px 2px;}
  details.keyset input{width:100%; border:none; border-radius:8px; padding:8px 10px; font-family:inherit; font-size:.85rem; margin-bottom:8px;}
  details.keyset button{background:var(--amber); border:none; border-radius:8px; padding:7px 14px;
    font-family:inherit; font-weight:700; cursor:pointer; font-size:.85rem; color:#3a2a00;}

  /* ---------- Main ---------- */
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--card);
    border-bottom:1px solid var(--line); box-shadow:var(--shadow); z-index:20;}
  .burger{display:none; background:none; border:none; font-size:1.4rem; cursor:pointer; color:var(--green-d);}
  .topbar .tt{font-weight:700; color:var(--green-d); font-size:1.05rem;}
  .topbar .sub{font-size:.78rem; color:var(--muted);}
  .scrim{display:none;}

  .msgs{flex:1; overflow-y:auto; padding:22px 16px 12px;}
  .msgs-inner{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:14px;}

  .hero-empty{text-align:center; padding:34px 10px 10px;}
  .hero-empty .big{font-size:3rem;}
  .hero-empty h2{margin:8px 0 4px; color:var(--green-d); font-size:1.4rem;}
  .hero-empty p{color:var(--muted); margin:0 0 14px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  .chip{background:var(--card); border:1px solid var(--line); color:var(--green-d); border-radius:999px;
    padding:8px 15px; font-size:.88rem; cursor:pointer; font-family:inherit; box-shadow:var(--shadow);}
  .chip:hover{border-color:var(--green); background:var(--soft);}

  .mrow{display:flex; gap:10px; align-items:flex-start; animation:fadeUp .25s ease;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  .mrow.user{justify-content:flex-end;}
  .avatar{flex:none; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:1.1rem; background:var(--soft); border:1px solid var(--line);}
  .mrow.user .avatar{background:var(--green); color:#fff; border:none;}
  .bubble{max-width:82%; padding:11px 15px; border-radius:16px; font-size:.97rem; word-wrap:break-word;}
  .mrow.user .bubble{background:var(--user-b); color:#fff; border-bottom-right-radius:6px;}
  .mrow.ai .bubble{background:var(--card); border:1px solid var(--line); border-bottom-left-radius:6px; box-shadow:var(--shadow);}
  .bubble p{margin:6px 0;}
  .bubble ul{margin:8px 0; padding-left:20px;}
  .bubble li{margin:3px 0;}
  .mactions{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .mbtn{background:var(--soft); border:1px solid var(--line); color:var(--green-d); border-radius:999px;
    padding:5px 12px; font-size:.8rem; cursor:pointer; font-family:inherit; font-weight:600;}
  .mbtn:hover{background:#e0efe3;}
  .prov{font-size:.72rem; color:var(--muted); margin-top:8px;}
  .typing{display:inline-flex; gap:5px; padding:14px 16px;}
  .typing span{width:8px; height:8px; border-radius:50%; background:#9db5a4; animation:tp 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes tp{0%,60%,100%{transform:none; opacity:.5;} 30%{transform:translateY(-5px); opacity:1;}}

  .composer{padding:12px 16px calc(14px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line);}
  .composer-inner{max-width:760px; margin:0 auto;}
  .cbox{display:flex; gap:8px; align-items:flex-end; background:var(--bg); border:2px solid var(--line);
    border-radius:16px; padding:8px 8px 8px 14px; transition:border-color .15s;}
  .cbox:focus-within{border-color:var(--green);}
  textarea#qInput{flex:1; border:none; background:transparent; resize:none; font-family:inherit; font-size:1rem;
    max-height:130px; padding:8px 0; line-height:1.55;}
  textarea#qInput:focus{outline:none;}
  .sendbtn{flex:none; width:44px; height:44px; border-radius:12px; border:none; background:var(--green); color:#fff;
    font-size:1.25rem; cursor:pointer;}
  .sendbtn:hover{background:var(--green-d);}
  .sendbtn:disabled{opacity:.55; cursor:wait;}
  .crow{display:flex; gap:8px; margin-top:8px; align-items:center;}
  select#catInput{border:1px solid var(--line); border-radius:10px; padding:7px 10px; font-family:inherit;
    font-size:.85rem; background:#fff; color:var(--muted);}
  .hint{font-size:.76rem; color:var(--muted);}

  /* ---------- v3 additions ---------- */
  .mrow.revealing .mactions{display:none;}
  .mrow.revealing .prov{display:none;}
  .top-right{margin-left:auto; display:flex; align-items:center; gap:8px;}
  .topbtn{background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:7px 11px;
    cursor:pointer; font-size:1.05rem; font-family:inherit; line-height:1;}
  .topbtn:hover{background:#e0efe3;}
  .aidot{width:11px; height:11px; border-radius:50%; background:#b9c9bd; display:inline-block; flex:none;}
  .aidot.ok{background:#22c55e; box-shadow:0 0 6px rgba(34,197,94,.7);}
  .aidot.bad{background:#ef4444; box-shadow:0 0 6px rgba(239,68,68,.7);}
  .micbtn{flex:none; width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--soft);
    color:var(--green-d); font-size:1.2rem; cursor:pointer; font-family:inherit;}
  .micbtn:hover{background:#e0efe3;}
  .micbtn.listening{background:#ef4444; border-color:#ef4444; color:#fff; animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.55;}}
  .sendbtn.stop{background:#ef4444;}
  .sendbtn.stop:hover{background:#dc2626;}

  /* ---------- Modal ---------- */
  .modal{display:none; position:fixed; inset:0; background:rgba(15,30,20,.55); z-index:100;
    align-items:center; justify-content:center; padding:18px;}
  .modal.open{display:flex;}
  .modal-card{background:#fff; border-radius:18px; max-width:620px; width:100%; max-height:82dvh; overflow-y:auto; padding:20px;}
  .modal-card h2{margin:0 0 6px; color:var(--green-d); font-size:1.2rem;}
  .mclose{float:right; background:var(--soft); border:none; border-radius:50%; width:34px; height:34px;
    font-size:1.1rem; cursor:pointer; color:var(--green-d);}
  .qa-item{border-bottom:1px solid var(--line); padding:12px 0;}
  .qa-item:last-child{border-bottom:none;}
  .qa-item .qq{font-weight:700; color:var(--green-d); cursor:pointer; font-size:.95rem;}
  .qa-item .aa{display:none; margin-top:8px; font-size:.92rem; color:#33473b;}
  .qa-item.open .aa{display:block;}

  .toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:#1d2b22; color:#fff;
    padding:10px 20px; border-radius:999px; opacity:0; transition:.3s; z-index:200; font-size:.92rem; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:820px){
    .sidebar{position:fixed; top:0; bottom:0; left:0; transform:translateX(-105%); transition:transform .25s ease;}
    .sidebar.open{transform:none; box-shadow:8px 0 30px rgba(0,0,0,.25);}
    .burger{display:block;}
    .scrim{display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30;
      opacity:0; pointer-events:none; transition:opacity .25s;}
    .scrim.on{opacity:1; pointer-events:auto;}
    .bubble{max-width:88%;}
  }
</style>
</head>
<body>
<div class="app">
  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>🤝 সাহায্য করি</h1>
      <p>Hasan-এর পক্ষ থেকে • সবার জন্য ফ্রি</p>
    </div>
    <button class="newchat" onclick="newChat()">➕ নতুন আলাপ</button>
    <div class="side-sec">সাম্প্রতিক আলাপ</div>
    <div class="convs" id="convList"></div>
    <div class="side-foot">
      <button class="side-btn" onclick="openModal()">🔥 জনপ্রিয় প্রশ্নোত্তর</button>
      <details class="keyset">
        <summary>⚙️ ফ্রি Groq কী (ঐচ্ছিক)</summary>
        <div class="kin">
          <input type="password" id="groqKeyInput" placeholder="gsk_...">
          <button onclick="saveGroqKey()">সেভ</button>
          <div style="margin-top:6px; opacity:.75;">কী শুধু তোমার ব্রাউজারে থাকে। <a href="https://console.groq.com" target="_blank" rel="noopener" style="color:#ffd97a;">ফ্রি কী নাও</a></div>
        </div>
      </details>
    </div>
  </aside>
  <div class="scrim" id="scrim" onclick="toggleSidebar(false)"></div>

  <!-- ===== Main ===== -->
  <div class="main">
    <div class="topbar">
      <button class="burger" onclick="toggleSidebar()">☰</button>
      <div>
        <div class="tt" id="chatTitle">সাহায্য করি</div>
        <div class="sub">AI মেন্টর • বাংলায় উত্তর দেয় 💚</div>
      </div>
      <div class="top-right">
        <span id="aiDot" class="aidot" title="AI স্ট্যাটাস"></span>
        <button class="topbtn" onclick="exportChat()" title="চ্যাট ডাউনলোড (.txt)">📥</button>
      </div>
    </div>

    <div class="msgs" id="msgs"><div class="msgs-inner" id="msgsInner"></div></div>

    <div class="composer">
      <div class="composer-inner">
        <div class="cbox">
          <textarea id="qInput" rows="1" placeholder="তোমার প্রশ্ন লেখো... (Enter = পাঠাও)"></textarea>
          <button class="micbtn" id="micBtn" onclick="toggleVoice()" title="ভয়েসে বলো 🎤">🎤</button>
          <button class="sendbtn" id="sendBtn" onclick="sendMessage()" title="পাঠাও">➤</button>
        </div>
        <div class="crow">
          <select id="catInput">
            <option value="">📂 বিষয় (ঐচ্ছিক)</option>
            <option>📚 পড়াশোনা</option>
            <option>💼 ব্যবসা ও আয়</option>
            <option>💻 প্রযুক্তি</option>
            <option>🏥 স্বাস্থ্য</option>
            <option>🌍 সাধারণ জ্ঞান</option>
            <option>✨ অন্যান্য</option>
          </select>
          <span class="hint">🛡️ অনৈতিক প্রশ্নের উত্তর দেওয়া হয় না</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== Popular modal ===== -->
<div class="modal" id="popModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <button class="mclose" onclick="closeModal()">✕</button>
    <h2>🔥 জনপ্রিয় প্রশ্নোত্তর</h2>
    <p style="color:var(--muted); font-size:.88rem; margin:0 0 8px;">ট্যাপ করে উত্তর দেখো, ভালো লাগলে Facebook-এ শেয়ার করো</p>
    <div id="popularList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
/* ================= সাহায্য করি v3 — Chat UI ================= */
var SYSTEM_PROMPT = "You are 'সাহায্য করি', a friendly AI mentor answering on behalf of Hasan, a Bangladeshi entrepreneur who started this free initiative to help everyone. "
  + "Always answer in Bengali (Bangla script). Be warm, practical and clear. "
  + "Structure: give the direct answer in 1-2 lines first, then key points as • bullets. Maximum ~250 words. "
  + "If the question asks for anything illegal, harmful, dangerous or unethical (weapons, fraud, hacking, cheating in exams, hate, self-harm, medical diagnosis), politely decline in Bengali and offer to help with something else instead. "
  + "Never claim to be human. If unsure, say so honestly in Bengali.";

var GROQ_ENDPOINT = 'https://api.groq.com/openai/v1/chat/completions';
var POLL_ENDPOINT = 'https://text.pollinations.ai/openai';
var GROQ_MODELS = ['openai/gpt-oss-120b', 'openai/gpt-oss-20b'];
var LS_KEY = 'sahajjokori_chats_v2';

var chats = {}, activeId = null, sending = false;
var currentAbort = null, typingStopped = false, revealTimer = null;

/* ---------- helpers ---------- */
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtText(s){
  var lines = String(s).split('\n'), html = '', inList = false;
  lines.forEach(function(ln){
    var t = ln.trim();
    if (/^[•\-*]\s+/.test(t)){
      if(!inList){ html += '<ul>'; inList = true; }
      html += '<li>' + esc(t.replace(/^[•\-*]\s+/,'')) + '</li>';
    } else {
      if(inList){ html += '</ul>'; inList = false; }
      if(t) html += '<p>' + esc(t) + '</p>';
    }
  });
  if(inList) html += '</ul>';
  return html || '<p>' + esc(s) + '</p>';
}
function uid(){ return 'c' + Date.now().toString(36) + Math.floor(Math.random()*9999).toString(36); }

/* ---------- storage ---------- */
function loadChats(){
  try{ chats = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }catch(e){ chats = {}; }
  // v1 history migration (one-time)
  try{
    var old = JSON.parse(localStorage.getItem('sahajjokori_history') || '[]');
    if(old.length && !localStorage.getItem('sahajjokori_migrated')){
      var id = uid(), msgs = [];
      old.slice().reverse().forEach(function(h){
        msgs.push({role:'user', text:h.q});
        msgs.push({role:'ai', text:h.a, prov:'⚠️ আগের সংস্করণ'});
      });
      chats[id] = { id:id, title:'আগের প্রশ্নগুলো', messages:msgs, updatedAt:Date.now() };
      localStorage.setItem('sahajjokori_migrated','1');
      localStorage.removeItem('sahajjokori_history');
    }
  }catch(e){}
}
function saveChats(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(chats)); }catch(e){} }

/* ---------- sidebar ---------- */
function toggleSidebar(force){
  var sb = document.getElementById('sidebar'), sc = document.getElementById('scrim');
  var open = (typeof force === 'boolean') ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open); sc.classList.toggle('on', open);
}
function renderConvList(){
  var el = document.getElementById('convList');
  var arr = Object.keys(chats).map(function(k){ return chats[k]; })
    .sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  if(!arr.length){ el.innerHTML = '<div class="empty-hist">এখনো কোনো আলাপ নেই।<br>নতুন আলাপ শুরু করো! 👇</div>'; return; }
  el.innerHTML = '';
  arr.forEach(function(c){
    var d = document.createElement('div');
    d.className = 'conv' + (c.id === activeId ? ' active' : '');
    var t = document.createElement('div'); t.className = 't'; t.textContent = '💬 ' + c.title;
    var x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.title = 'মুছে ফেলো';
    x.onclick = function(e){ e.stopPropagation(); deleteChat(c.id); };
    d.appendChild(t); d.appendChild(x);
    d.onclick = function(){ selectChat(c.id); };
    el.appendChild(d);
  });
}
function newChat(){
  var id = uid();
  chats[id] = { id:id, title:'নতুন আলাপ', messages:[], updatedAt:Date.now() };
  activeId = id; saveChats(); renderConvList(); renderMessages();
  toggleSidebar(false);
  document.getElementById('qInput').focus();
}
function selectChat(id){
  activeId = id; renderConvList(); renderMessages(); toggleSidebar(false);
}
function deleteChat(id){
  delete chats[id]; saveChats();
  if(activeId === id){
    var rest = Object.keys(chats);
    activeId = rest.length ? rest[0] : null;
    if(!activeId) newChatSilent();
  }
  renderConvList(); renderMessages();
}
function newChatSilent(){
  var id = uid();
  chats[id] = { id:id, title:'নতুন আলাপ', messages:[], updatedAt:Date.now() };
  activeId = id;
}
function ensureChat(){
  if(!activeId || !chats[activeId]) newChatSilent();
}

/* ---------- messages ---------- */
var SAMPLE_CHIPS = [
  'অনলাইনে আয় শুরু করতে চাই, প্রথমে কী করবো?',
  'পরীক্ষার পড়া মনে থাকে না, কী করবো?',
  'ছোট পুঁজিতে কোন ব্যবসা ভালো হবে?',
  'মোবাইল দিয়ে ফ্রিল্যান্সিং শেখা যায়?',
  'ইংরেজিতে কথা বলার ভয় কাটাবো কীভাবে?'
];
function renderMessages(){
  ensureChat();
  var c = chats[activeId];
  var box = document.getElementById('msgsInner');
  document.getElementById('chatTitle').textContent = c.title === 'নতুন আলাপ' ? 'সাহায্য করি' : c.title;
  box.innerHTML = '';
  if(!c.messages.length){
    var h = document.createElement('div');
    h.className = 'hero-empty';
    h.innerHTML = '<div class="big">🤝</div><h2>কীভাবে সাহায্য করতে পারি?</h2>'

/* ---------- AI chain (v3: abort-aware, nonstop) ---------- */
var OFFLINE_MSG = '😔 দুঃখিত! এই মুহূর্তে AI সার্ভারে পৌঁছানো যাচ্ছে না।\n\n• একটু পরে আবার চেষ্টা করো\n• অথবা সাইডবারের ⚙️ থেকে ফ্রি Groq কী বসাও — তাহলে আরও নির্ভরযোগ্যভাবে চলবে';

function linkSignal(localCtl, extSignal){
  if(!extSignal) return function(){};
  if(extSignal.aborted){ try{ localCtl.abort(); }catch(e){} return function(){}; }
  var onA = function(){ try{ localCtl.abort(); }catch(e){} };
  extSignal.addEventListener('abort', onA, {once:true});
  return function(){ try{ extSignal.removeEventListener('abort', onA); }catch(e){} };
}
function isUserAbort(e, sig){ return !!(e && e.name === 'AbortError' && sig && sig.aborted); }
function sleepAbort(ms, sig){
  return new Promise(function(res, rej){
    var done = false;
    var to = setTimeout(function(){ cleanup(); res(); }, ms);
    function onA(){ if(done) return; done = true; cleanup(); rej(new DOMException('aborted','AbortError')); }
    function cleanup(){ clearTimeout(to); if(sig){ try{ sig.removeEventListener('abort', onA); }catch(e){} } }
    if(sig){
      if(sig.aborted){ onA(); return; }
      sig.addEventListener('abort', onA, {once:true});
    }
  });
}
async function requestGroqModel(question, model, key, extSignal){
  var ctl = new AbortController();
  var unlink = linkSignal(ctl, extSignal);
  var to = setTimeout(function(){ ctl.abort(); }, 25000);
  try{
    var r = await fetch(GROQ_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
      body: JSON.stringify({
        model: model,
        messages:[ {role:'system', content:SYSTEM_PROMPT}, {role:'user', content:question} ],
        temperature:0.5, max_tokens:1200, reasoning_format:'hidden', reasoning_effort:'low'
      }),
      signal: ctl.signal
    });
    var txt = ''; try{ txt = await r.text(); }catch(e){}
    if(!r.ok) throw new Error('Groq '+r.status);
    var p = JSON.parse(txt);
    var c = p && p.choices && p.choices[0] && p.choices[0].message ? p.choices[0].message.content : '';
    if(!c) throw new Error('empty');
    return c;
  } finally { clearTimeout(to); unlink(); }
}
async function requestPollinationsModel(question, model, extSignal){
  var ctl = new AbortController();
  var unlink = linkSignal(ctl, extSignal);
  var to = setTimeout(function(){ ctl.abort(); }, 30000);
  try{
    var r = await fetch(POLL_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        model: model,
        messages:[ {role:'system', content:SYSTEM_PROMPT}, {role:'user', content:question} ],
        temperature:0.5, private:true
      }),
      signal: ctl.signal
    });
    if(!r.ok) throw new Error('AI service '+r.status);
    var p = await r.json();
    var c = p && p.choices && p.choices[0] && p.choices[0].message ? p.choices[0].message.content : '';
    if(!c) throw new Error('empty');
    return c;
  } finally { clearTimeout(to); unlink(); }
}
/* Nonstop chain: Groq model 1 → Groq model 2 → Pollinations openai → Pollinations mistral → offline notice */
async function fetchAnswer(question, extSignal){
  var key = getGroqKey();
  if(key){
    for(var mi=0; mi<GROQ_MODELS.length; mi++){
      try{
        var t = await requestGroqModel(question, GROQ_MODELS[mi], key, extSignal);
        return { text:t, prov:'⚡ Groq AI • সাহায্য করি মেন্টর', ok:true };
      }catch(e){ if(isUserAbort(e, extSignal)) throw e; }
    }
  }
  for(var a=1; a<=2; a++){
    try{
      var t2 = await requestPollinationsModel(question, 'openai', extSignal);
      return { text:t2, prov:'🌐 ফ্রি AI • সাহায্য করি মেন্টর', ok:true };
    }catch(e){
      if(isUserAbort(e, extSignal)) throw e;
      if(a===1){ try{ await sleepAbort(1500, extSignal); }catch(se){ throw se; } }
    }
  }
  try{
    var t3 = await requestPollinationsModel(question, 'mistral', extSignal);
    return { text:t3, prov:'🌐 ফ্রি AI • সাহায্য করি মেন্টর', ok:true };
  }catch(e){ if(isUserAbort(e, extSignal)) throw e; }
  return { text:OFFLINE_MSG, prov:'⚠️ অফলাইন', ok:false };
}
function setAIStatus(ok){
  var d = document.getElementById('aiDot');
  if(!d) return;
  d.classList.remove('ok','bad');
  if(ok === true){ d.classList.add('ok'); d.title = 'AI সচল আছে ✅ — শেষ উত্তর সফল'; }
  else if(ok === false){ d.classList.add('bad'); d.title = 'শেষ উত্তরে সমস্যা হয়েছিল ❌ — আবার চেষ্টা করো'; }
}

/* ---------- send / stop / reveal / regenerate (v3) ---------- */
function setSendBtn(mode){
  var b = document.getElementById('sendBtn');
  if(!b) return;
  if(mode === 'stop'){ b.innerHTML = '⏹'; b.title = 'থামাও'; b.disabled = false; b.classList.add('stop'); }
  else { b.innerHTML = '➤'; b.title = 'পাঠাও'; b.disabled = false; b.classList.remove('stop'); }
}
function finishSending(){
  sending = false; currentAbort = null; typingStopped = false;
  setSendBtn('send');
}
function stopGenerating(){
  typingStopped = true;
  if(currentAbort){ try{ currentAbort.abort(); }catch(e){} }
}
function revealInto(chatId, msgIdx, fullText, prov){
  var c = chats[chatId];
  if(!c || !c.messages[msgIdx]){ finishSending(); return; }
  var msg = c.messages[msgIdx];
  msg.prov = prov;
  typingStopped = false;
  var i = 0;
  clearInterval(revealTimer);
  revealTimer = setInterval(function(){
    if(typingStopped){ finishReveal(true); return; }
    i += 24;
    if(activeId === chatId){
      var target = document.querySelector('#msgsInner .mrow.ai[data-midx="'+msgIdx+'"] .atext');
      if(target){ target.innerHTML = fmtText(fullText.slice(0, i)); scrollBottom(); }
    }
    if(i >= fullText.length){ finishReveal(false); }
  }, 18);
  function finishReveal(stopped){
    clearInterval(revealTimer); revealTimer = null;
    msg.text = stopped ? fullText.slice(0, i) : fullText;
    c.updatedAt = Date.now(); saveChats();
    finishSending();
    renderConvList();
    if(activeId === chatId) renderMessages();
  }
}
async function sendMessage(){
  if(sending){ stopGenerating(); return; }
  var inp = document.getElementById('qInput');
  var q = inp.value.trim();
  var cat = document.getElementById('catInput').value;
  if(!q){ toast('আগে তোমার প্রশ্নটা লেখো ✍️'); return; }
  ensureChat();
  var c = chats[activeId];
  var chatId = activeId;
  sending = true;
  currentAbort = new AbortController(); typingStopped = false;
  setSendBtn('stop');
  c.messages.push({role:'user', text:q});
  if(c.messages.length === 1) c.title = q.length > 42 ? q.slice(0,42) + '…' : q;
  c.updatedAt = Date.now();
  inp.value = ''; autoGrow();
  saveChats(); renderConvList(); renderMessages(); showTyping();

  var fullQ = cat ? ('[' + cat.replace(/^[^\s]+\s/,'') + ' বিষয়ে] ' + q) : q;
  var sig = currentAbort.signal;
  try{
    var res = await fetchAnswer(fullQ, sig);
    hideTyping();
    setAIStatus(res.ok);
    if(!chats[chatId]){ finishSending(); return; }
    chats[chatId].messages.push({role:'ai', text:'', prov:'', q:q});
    var msgIdx = chats[chatId].messages.length - 1;
    chats[chatId].updatedAt = Date.now(); saveChats();
    renderConvList();
    if(activeId === chatId){
      renderMessages();
      var rowEl = document.querySelector('#msgsInner .mrow.ai[data-midx="'+msgIdx+'"]');
      if(rowEl) rowEl.classList.add('revealing');
    }
    revealInto(chatId, msgIdx, res.text, res.prov);
  }catch(e){
    hideTyping();
    if(chats[chatId]){
      if(isUserAbort(e, sig)){
        chats[chatId].messages.push({role:'ai', text:'⏹️ উত্তর থামিয়ে দেওয়া হয়েছে।', prov:'⏹️ থামানো', q:q});
        toast('⏹️ থামানো হয়েছে');
      } else {
        chats[chatId].messages.push({role:'ai', text:OFFLINE_MSG, prov:'⚠️ অফলাইন', q:q});
        setAIStatus(false);
      }
      chats[chatId].updatedAt = Date.now(); saveChats();
      renderConvList();
      if(activeId === chatId) renderMessages();
    }
    finishSending();
  }
}
async function regenerateAnswer(idx){
  if(sending){ toast('আগে চলমান উত্তর শেষ হতে দাও ⏳'); return; }
  ensureChat();
  var c = chats[activeId];
  var chatId = activeId;
  var m = c.messages[idx];
  if(!m || m.role !== 'ai') return;
  var q = m.q || (idx > 0 && c.messages[idx-1] && c.messages[idx-1].role === 'user' ? c.messages[idx-1].text : '');
  if(!q){ toast('প্রশ্ন পাওয়া যায়নি'); return; }
  sending = true;
  currentAbort = new AbortController(); typingStopped = false;
  setSendBtn('stop');
  m.text = ''; m.prov = '';
  saveChats(); renderMessages();
  var rowEl = document.querySelector('#msgsInner .mrow.ai[data-midx="'+idx+'"]');
  if(rowEl){
    rowEl.classList.add('revealing');
    var at = rowEl.querySelector('.atext');
    if(at) at.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    scrollBottom();
  }
  var sig = currentAbort.signal;
  try{
    var res = await fetchAnswer(q, sig);
    setAIStatus(res.ok);
    if(!chats[chatId]){ finishSending(); return; }
    revealInto(chatId, idx, res.text, res.prov);
  }catch(e){
    if(chats[chatId]){
      var mm = chats[chatId].messages[idx];
      if(mm){
        if(isUserAbort(e, sig)){ mm.text = '⏹️ উত্তর থামিয়ে দেওয়া হয়েছে।'; mm.prov = '⏹️ থামানো'; toast('⏹️ থামানো হয়েছে'); }
        else { mm.text = OFFLINE_MSG; mm.prov = '⚠️ অফলাইন'; setAIStatus(false); }
      }
      chats[chatId].updatedAt = Date.now(); saveChats();
      renderConvList();
      if(activeId === chatId) renderMessages();
    }
    finishSending();
  }
}

/* ---------- share / copy / speak ---------- */
function doCopy(text, msg){
  function done(){ toast(msg); }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('কপি হয়নি'); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
}
function fbFormat(q, a){
  return '❓ প্রশ্ন: ' + q + '\n\n💡 উত্তর (সাহায্য করি AI মেন্টর):\n' + a
    + '\n\n🤝 তোমারও কোনো প্রশ্ন আছে? সাহায্য করি — সবার জন্য উন্মুক্ত!\n#সাহাযযকরি #SahajjoKori';
}
function shareToFB(idx){
  var c = chats[activeId];
  var m = c.messages[idx];
  var q = m.q || '(প্রশ্ন)';
  doCopy(fbFormat(q, m.text), '📘 Facebook পোস্ট ফরম্যাট কপি হয়েছে!');

function speakText(text){
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'bn-BD'; u.rate = 0.95;
    var bn = speechSynthesis.getVoices().filter(function(v){ return /bn/i.test(v.lang); });
    if(bn.length) u.voice = bn[0];
    speechSynthesis.speak(u);
  }catch(e){ toast('এই ব্রাউজারে ভয়েস সাপোর্ট নেই'); }
}

/* ---------- voice input (v3) ---------- */
var recog = null, listening = false;
function toggleVoice(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('এই ব্রাউজারে ভয়েস সাপোর্ট নেই'); return; }
  if(listening){ try{ recog.stop(); }catch(e){} return; }
  var ta = document.getElementById('qInput');
  var base = ta.value;
  recog = new SR();
  recog.lang = 'bn-BD';
  recog.interimResults = true;
  recog.continuous = false;
  recog.onresult = function(ev){
    var fin = '', interim = '';
    for(var i=ev.resultIndex; i<ev.results.length; i++){
      if(ev.results[i].isFinal) fin += ev.results[i][0].transcript;
      else interim += ev.results[i][0].transcript;
    }
    ta.value = (base ? base + ' ' : '') + (fin + interim).trim();
    autoGrow();
  };
  recog.onend = function(){ listening = false; var b = document.getElementById('micBtn'); if(b) b.classList.remove('listening'); };
  recog.onerror = function(){ listening = false; var b = document.getElementById('micBtn'); if(b) b.classList.remove('listening'); };
  try{
    recog.start();
    listening = true;
    document.getElementById('micBtn').classList.add('listening');
    toast('🎤 বলো...');
  }catch(e){ toast('ভয়েস চালু হয়নি'); }
}

function openModal(){
  var p = document.getElementById('popularList');
  p.innerHTML = '';
  POPULAR.forEach(function(item, i){
    var d = document.createElement('div');
    d.className = 'qa-item';
    d.innerHTML = '<div class="qq">❓ ' + esc(item.q) + '</div><div class="aa">' + fmtText(item.a)
      + '<div style="margin-top:10px;"><button class="mbtn" id="pfb'+i+'">📘 Facebook-এ শেয়ার করো</button></div></div>';
    d.querySelector('.qq').onclick = function(){ d.classList.toggle('open'); };
    p.appendChild(d);
  });
  POPULAR.forEach(function(item, i){
    document.getElementById('pfb'+i).onclick = function(){
      doCopy(fbFormat(item.q, item.a), '📘 Facebook পোস্ট ফরম্যাট কপি হয়েছে!');
    };
  });
  document.getElementById('popModal').classList.add('open');
  toggleSidebar(false);
}
function closeModal(){ document.getElementById('popModal').classList.remove('open'); }

/* ---------- composer ---------- */
function autoGrow(){
  var t = document.getElementById('qInput');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 130) + 'px';
}
document.getElementById('qInput').addEventListener('input', autoGrow);
document.getElementById('qInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); if(!sending) sendMessage(); }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ closeModal(); toggleSidebar(false); }
});

/* ---------- init ---------- */
loadChats();
if(!activeId || !chats[activeId]){
  var ids = Object.keys(chats);
  if(ids.length){ activeId = ids.sort(function(a,b){ return chats[b].updatedAt - chats[a].updatedAt; })[0]; }
  else newChatSilent();
  saveChats();
}
renderConvList();
renderMessages();
autoGrow();
</script>
